<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex, nofollow"/>
    <title th:text="${coupleName}">Undangan</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #1a1a24;
            color: #fdf6ee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .box {
            width: 100%;
            max-width: 320px;
            text-align: center;
            padding: 2rem;
            border: 1px solid rgba(201, 169, 110, .35);
            border-radius: 14px;
            background: rgba(255, 255, 255, .06);
        }
        .couple {
            font-size: 1.8rem;
            color: #c9a96e;
            margin: 0 0 .5rem;
        }
        .label {
            font-size: .75rem;
            letter-spacing: .08em;
            color: #e8d5b0;
            opacity: .7;
            margin: 0 0 1.25rem;
        }
        input {
            width: 100%;
            padding: .7rem;
            text-align: center;
            letter-spacing: .3em;
            font-size: 1.2rem;
            border: 1px solid rgba(201, 169, 110, .4);
            border-radius: 8px;
            background: rgba(255, 255, 255, .06);
            color: #fdf6ee;
            outline: none;
            margin-bottom: .9rem;
        }
        input:focus { border-color: #c9a96e; }
        button {
            width: 100%;
            padding: .6rem;
            background: #c9a96e;
            color: #1a1a24;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        button:focus-visible { outline: 2px solid #fdf6ee; outline-offset: 2px; }
        .error {
            margin: .7rem 0 0;
            font-size: .75rem;
            color: #e07070;
        }
    </style>
</head>
<body>
<div class="box">
    <p class="couple" th:text="${coupleName}">Pasangan</p>
    <p class="label">Masukkan PIN untuk membuka undangan</p>
    <form th:action="@{'/i/' + ${slug} + '/pin'}" method="post">
        <input type="password" name="pin" autocomplete="off" autofocus
               aria-label="PIN undangan"/>
        <input type="hidden" name="to" th:value="${guestGreeting}"/>
        <button type="submit">Buka</button>
    </form>
    <p class="error" th:if="${pinError}">PIN salah. Coba lagi.</p>
</div>
</body>
</html>
