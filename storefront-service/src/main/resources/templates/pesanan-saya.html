<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id"
      th:replace="~{layout/base :: dir(~{::title}, ~{::main})}">
<head>
  <title>Pesanan Saya — baundang.id</title>
</head>
<body>
<main x-data="ordersApp()" x-init="load()" class="max-w-3xl mx-auto px-4 py-12">

  <div class="mb-8 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-stone-800">Pesanan Saya</h1>
      <p class="text-stone-500 mt-1 text-sm">Pantau status pesanan dan undanganmu</p>
    </div>
    <button @click="logout()" class="text-sm text-stone-400 hover:text-rose-600">Keluar</button>
  </div>

  <!-- Claim an order placed before signing in -->
  <div class="mb-8 p-4 rounded-xl bg-stone-50 border border-stone-200">
    <div class="flex items-center justify-between gap-4">
      <div>
        <p class="text-sm font-medium text-stone-700">Pesan sebelum punya akun?</p>
        <p class="text-xs text-stone-500 mt-0.5">Hubungkan pesanan lamamu ke akun ini.</p>
      </div>
      <button @click="claimOpen = !claimOpen"
              class="text-sm text-rose-600 hover:text-rose-700 font-medium whitespace-nowrap">
        Hubungkan Pesanan
      </button>
    </div>

    <div x-show="claimOpen" x-cloak class="mt-4 pt-4 border-t border-stone-200 space-y-3">
      <div>
        <label for="claimNumber" class="block text-xs text-stone-500 mb-1">Nomor Pesanan</label>
        <input id="claimNumber" x-model="claimNumber" placeholder="BND-20260814-1234"
               class="w-full px-3 py-2 rounded-lg border border-stone-200 text-sm font-mono focus:outline-none focus:border-rose-400"/>
      </div>
      <div>
        <label for="claimContact" class="block text-xs text-stone-500 mb-1">Email atau WhatsApp pada pesanan</label>
        <input id="claimContact" x-model="claimContact" placeholder="nama@email.com atau 08…"
               class="w-full px-3 py-2 rounded-lg border border-stone-200 text-sm focus:outline-none focus:border-rose-400"/>
      </div>
      <p x-show="claimError" x-cloak class="text-xs text-red-600" x-text="claimError"></p>
      <p x-show="claimOk" x-cloak class="text-xs text-emerald-600">Pesanan berhasil dihubungkan.</p>
      <button @click="submitClaim()" :disabled="claimSaving"
              class="bg-rose-600 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-rose-700 disabled:opacity-50">
        <span x-show="!claimSaving">Hubungkan</span>
        <span x-show="claimSaving" x-cloak>Menghubungkan…</span>
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="text-center py-20 text-stone-400 text-sm">Memuat pesanan…</div>

  <!-- Error -->
  <div x-show="error" x-cloak class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm" x-text="error"></div>

  <!-- Empty -->
  <div x-show="!loading && !error && orders.length === 0" x-cloak class="text-center py-20">
    <p class="text-stone-500">Belum ada pesanan.</p>
    <a href="/templates" class="inline-block mt-4 bg-rose-600 text-white px-6 py-2.5 rounded-full text-sm font-medium hover:bg-rose-700">Pilih Template</a>
  </div>

  <!-- Orders -->
  <div x-show="!loading && orders.length > 0" x-cloak class="space-y-5">
    <template x-for="o in orders" :key="o.id">
      <div class="bg-white rounded-2xl border border-stone-100 shadow-sm p-6">

        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="font-semibold text-stone-800" x-text="o.coupleName || '—'"></p>
            <p class="text-xs text-stone-400 font-mono mt-0.5" x-text="o.orderNumber"></p>
          </div>
          <span class="text-xs px-2.5 py-1 rounded-full font-medium whitespace-nowrap"
                :class="badgeClass(o.status)" x-text="statusLabel(o.status)"></span>
        </div>

        <!-- Progress timeline -->
        <div class="mt-6" x-show="o.status !== 'CANCELLED'">
          <div class="flex items-center">
            <template x-for="(step, i) in steps" :key="i">
              <div class="flex items-center" :class="i < steps.length - 1 ? 'flex-1' : ''">
                <div class="flex flex-col items-center">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold"
                       :class="stepIndex(o.status) >= i ? 'bg-rose-600 text-white' : 'bg-stone-100 text-stone-400'">
                    <span x-show="stepIndex(o.status) > i">✓</span>
                    <span x-show="stepIndex(o.status) <= i" x-text="i + 1"></span>
                  </div>
                </div>
                <div x-show="i < steps.length - 1" class="flex-1 h-0.5 mx-1"
                     :class="stepIndex(o.status) > i ? 'bg-rose-400' : 'bg-stone-200'"></div>
              </div>
            </template>
          </div>
          <div class="flex justify-between mt-2">
            <template x-for="(step, i) in steps" :key="i">
              <span class="text-[10px] text-center flex-1"
                    :class="stepIndex(o.status) >= i ? 'text-rose-600 font-medium' : 'text-stone-400'"
                    x-text="step"></span>
            </template>
          </div>
        </div>

        <div x-show="o.status === 'CANCELLED'" x-cloak class="mt-4 text-sm text-stone-500">
          Pesanan ini dibatalkan.
        </div>

        <!-- Meta -->
        <div class="mt-6 grid grid-cols-2 gap-3 text-sm">
          <div>
            <p class="text-stone-400 text-xs">Paket</p>
            <p class="text-stone-700 font-medium" x-text="tierName(o.tier)"></p>
          </div>
          <div>
            <p class="text-stone-400 text-xs">Total</p>
            <p class="text-stone-700 font-medium" x-text="formatRupiah(o.amount)"></p>
          </div>
          <div x-show="o.maxRevisions > 0">
            <p class="text-stone-400 text-xs">Revisi terpakai</p>
            <p class="text-stone-700 font-medium" x-text="o.revisionCount + ' / ' + o.maxRevisions"></p>
          </div>
          <div x-show="o.paidAt">
            <p class="text-stone-400 text-xs">Dibayar</p>
            <p class="text-stone-700 font-medium" x-text="formatDate(o.paidAt)"></p>
          </div>
        </div>

        <!-- Actions -->
        <div class="mt-6 flex flex-wrap gap-2">
          <a x-show="o.status === 'PENDING'" :href="'/bayar/' + o.id"
             class="bg-rose-600 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-rose-700">Bayar Sekarang</a>

          <a x-show="o.status === 'PAID' || o.status === 'IN_REVISION' || o.status === 'COMPLETED'"
             :href="'/pesanan/' + o.id + '/intake'"
             class="bg-stone-800 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-stone-900"
             x-text="o.intakeDone ? 'Lihat Jawaban' : 'Isi Detail Undangan'"></a>

          <a x-show="o.status === 'PAID' || o.status === 'IN_REVISION' || o.status === 'COMPLETED'"
             :href="'/pesanan/' + o.id + '/kelola'"
             class="border border-rose-200 text-rose-700 px-4 py-2 rounded-full text-sm font-medium hover:bg-rose-50">Kelola Undangan</a>

          <button x-show="(o.status === 'PAID' || o.status === 'IN_REVISION') && o.maxRevisions > 0 && o.revisionCount < o.maxRevisions"
                  @click="openRevision(o)"
                  class="border border-stone-200 text-stone-700 px-4 py-2 rounded-full text-sm font-medium hover:bg-stone-50">
            Minta Revisi (<span x-text="o.maxRevisions - o.revisionCount"></span> tersisa)
          </button>

          <a x-show="o.coupleSlug" :href="'/i/' + o.coupleSlug" target="_blank"
             class="border border-stone-200 text-stone-700 px-4 py-2 rounded-full text-sm font-medium hover:bg-stone-50">Lihat Undangan ↗</a>
        </div>

      </div>
    </template>
  </div>

  <!-- Revision request modal -->
  <div x-show="revOpen" x-cloak @click.self="revOpen = false"
       class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full">
      <h3 class="text-lg font-semibold text-stone-800">Minta Revisi</h3>
      <p class="text-sm text-stone-500 mt-1">
        Jelaskan perubahan yang kamu inginkan pada undangan
        <span class="font-medium text-stone-700" x-text="revOrder?.coupleName"></span>.
        Sisa kuota: <span class="font-medium" x-text="revOrder ? (revOrder.maxRevisions - revOrder.revisionCount) : 0"></span> revisi.
      </p>
      <textarea x-model="revNote" rows="4" placeholder="Contoh: Ganti foto sampul, perbaiki nama orang tua, ubah warna tema..."
                class="mt-4 w-full border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 resize-none"></textarea>
      <p x-show="revError" x-cloak class="mt-2 text-sm text-red-600" x-text="revError"></p>
      <div class="mt-5 flex gap-3">
        <button @click="revOpen = false"
                class="flex-1 border border-stone-200 text-stone-600 py-2.5 rounded-full text-sm font-medium hover:bg-stone-50">Batal</button>
        <button @click="submitRevision()" :disabled="revSaving"
                class="flex-1 bg-rose-600 text-white py-2.5 rounded-full text-sm font-medium hover:bg-rose-700 disabled:opacity-50"
                x-text="revSaving ? 'Mengirim…' : 'Kirim Permintaan'"></button>
      </div>
    </div>
  </div>

  <script>
    function ordersApp() {
      return {
        orders: [], loading: true, error: '',
        revOpen: false, revOrder: null, revNote: '', revError: '', revSaving: false,
        claimOpen: false, claimNumber: '', claimContact: '',
        claimError: '', claimOk: false, claimSaving: false,
        steps: ['Dipesan', 'Dibayar', 'Dikerjakan', 'Selesai'],
        token() { return sessionStorage.getItem('buyer_token'); },
        async load() {
          if (!this.token()) { window.location.href = '/masuk?redirect=/pesanan-saya'; return; }
          try {
            const res = await fetch('/api/v1/orders/mine', {
              headers: { 'Authorization': 'Bearer ' + this.token() }
            });
            if (res.status === 401) {
              if (await window.tryRefreshToken()) { return this.load(); }
              sessionStorage.removeItem('buyer_token'); window.location.href = '/masuk?redirect=/pesanan-saya'; return;
            }
            if (!res.ok) throw new Error('Gagal memuat pesanan');
            const data = await res.json();
            this.orders = (data.data?.content || data.content || data.data || []);
          } catch (e) { this.error = e.message; }
          finally { this.loading = false; }
        },
        async submitClaim() {
          if (!this.claimNumber.trim() || !this.claimContact.trim()) {
            this.claimError = 'Isi nomor pesanan dan email/WhatsApp yang dipakai saat memesan.';
            return;
          }
          this.claimSaving = true; this.claimError = ''; this.claimOk = false;
          try {
            const res = await fetch('/api/v1/orders/claim', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token() },
              body: JSON.stringify({
                orderNumber: this.claimNumber.trim(),
                contact: this.claimContact.trim()
              })
            });
            if (res.status === 401 && await window.tryRefreshToken()) {
              this.claimSaving = false; return this.submitClaim();
            }
            const data = await res.json();
            if (!res.ok) {
              this.claimError = data.message || 'Pesanan tidak ditemukan. Periksa kembali datanya.';
              return;
            }
            this.claimOk = true;
            this.claimNumber = ''; this.claimContact = '';
            await this.load();
          } catch (e) { this.claimError = 'Terjadi kesalahan, coba lagi.'; }
          finally { this.claimSaving = false; }
        },
        logout() {
          sessionStorage.removeItem('buyer_token');
          sessionStorage.removeItem('buyer_refresh');
          window.location.href = '/';
        },
        openRevision(o) {
          this.revOrder = o; this.revNote = ''; this.revError = ''; this.revOpen = true;
        },
        async submitRevision() {
          if (!this.revNote.trim()) { this.revError = 'Tuliskan detail revisi yang diinginkan.'; return; }
          this.revSaving = true; this.revError = '';
          try {
            const res = await fetch('/api/v1/orders/' + this.revOrder.id + '/revisions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token() },
              body: JSON.stringify({ changes: { note: this.revNote.trim() } })
            });
            if (res.status === 401 && await window.tryRefreshToken()) { this.revSaving = false; return this.submitRevision(); }
            const data = await res.json();
            if (!res.ok) { this.revError = data.message || 'Gagal mengirim permintaan revisi.'; return; }
            this.revOpen = false;
            await this.load();
          } catch (e) { this.revError = 'Terjadi kesalahan, coba lagi.'; }
          finally { this.revSaving = false; }
        },
        stepIndex(status) {
          switch (status) {
            case 'PENDING': return 0;
            case 'PAID': return 1;
            case 'IN_REVISION': return 2;
            case 'COMPLETED': return 3;
            default: return 0;
          }
        },
        statusLabel(s) {
          return ({ PENDING: 'Menunggu Pembayaran', PAID: 'Dibayar', IN_REVISION: 'Dalam Pengerjaan',
                    COMPLETED: 'Selesai', CANCELLED: 'Dibatalkan' })[s] || s;
        },
        badgeClass(s) {
          return ({ PENDING: 'bg-amber-100 text-amber-700', PAID: 'bg-blue-100 text-blue-700',
                    IN_REVISION: 'bg-indigo-100 text-indigo-700', COMPLETED: 'bg-green-100 text-green-700',
                    CANCELLED: 'bg-stone-100 text-stone-500' })[s] || 'bg-stone-100 text-stone-600';
        },
        tierName(t) { return ({ 1: 'Dasar', 2: 'Standar', 3: 'Premium' })[t] || ('Paket ' + t); },
        formatRupiah(n) { return 'Rp ' + (n || 0).toLocaleString('id-ID'); },
        formatDate(s) { try { return new Date(s).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); } catch(e){ return s; } }
      };
    }
  </script>
</main>
</body>
</html>
